<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿亮实测</title>
<style>
:root{--paper:#f1f4ee;--ink:#19221e;--muted:#65736b;--line:#d5ddd7;--accent:#315a43}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit}
header{background:#e5ece3;padding:52px max(5vw,24px);border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(44px,5.5vw,78px);font-weight:650;letter-spacing:-2px;line-height:1.2}
main{max-width:1800px;margin:auto;padding:0 max(5vw,24px) 80px}nav{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:12px;padding:28px 0;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:40px;padding:14px 26px;cursor:pointer;font-size:20px;font-weight:550}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}
.group{margin:14px 0 64px}.group h2{font-size:40px;line-height:1.2;margin:0 0 26px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.preview{display:block;width:100%;aspect-ratio:16/9;background:#17231c;overflow:hidden}.preview img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}.preview:hover img{transform:scale(1.025)}video.preview{object-fit:contain}
.body{padding:28px 30px 30px}.body h3{font-size:clamp(23px,2vw,30px);font-weight:600;line-height:1.5;margin:0;overflow-wrap:anywhere}.body p{font-size:19px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:16px 0 0}button:focus-visible,a:focus-visible{outline:3px solid #779e83;outline-offset:4px}
@media(min-width:1450px){.body{padding:32px 36px 36px}.body p{font-size:21px}}
@media(max-width:700px){header{padding:32px 22px}main{padding:0 18px 40px}nav{gap:8px;padding:20px 0}.filter{font-size:16px;padding:11px 17px}.grid{grid-template-columns:1fr;gap:22px}.group{margin-top:10px;margin-bottom:42px}.group h2{font-size:32px;margin-bottom:20px}.body{padding:22px}.body h3{font-size:24px}.body p{font-size:17px}h1{letter-spacing:-1px}}
.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.card-heading h3{flex:1;min-width:0}.demo-button{flex:none;max-width:170px;border:1px solid #adc3b3;background:#edf4ee;color:var(--accent);border-radius:9px;padding:13px 16px;font-size:16px;font-weight:600;line-height:1.5;cursor:pointer}.demo-button:hover{background:#dcebdc}
#demo-dialog{width:min(1080px,94vw);max-height:94dvh;padding:0;border:1px solid var(--line);border-radius:14px;background:#f5f7f2;color:var(--ink);overflow:auto}#demo-dialog::backdrop{background:#08120bd9}.demo-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px}.demo-header h2{font-size:21px;margin:0;line-height:1.4}.demo-close{flex:none;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}.demo-tabs{display:flex;gap:10px;padding:0 22px 16px}.demo-tabs[hidden]{display:none}.demo-tabs button{border:1px solid var(--line);border-radius:24px;padding:8px 18px;background:white;color:var(--muted);cursor:pointer}.demo-tabs button.active{color:white;background:var(--accent);border-color:var(--accent)}#demo-video{display:block;width:100%;height:min(70dvh,720px);object-fit:contain;background:#0b100d}
@media(max-width:700px){.card-heading{flex-wrap:wrap;gap:14px}.card-heading h3{flex-basis:100%}.demo-button{max-width:none;font-size:15px;padding:10px 14px}.demo-header{padding:14px;gap:12px}.demo-header h2{font-size:18px}.demo-tabs{padding:0 14px 14px}#demo-video{height:65dvh}}
</style></head><body>
<header><h1>阿亮实测</h1></header><main>
<nav aria-label="案例分类"><button class="filter active" data-category="video" aria-pressed="true">视频案例</button><button class="filter" data-category="3d" aria-pressed="false">3D模型</button><button class="filter" data-category="web" aria-pressed="false">设计+ 代码</button></nav><div id="cases"></div></main>
<dialog id="demo-dialog" aria-labelledby="demo-title"><div class="demo-header"><h2 id="demo-title"></h2><button type="button" class="demo-close" aria-label="关闭演示视频">关闭 ×</button></div><div class="demo-tabs" aria-label="演示视频版本"></div><video id="demo-video" controls playsinline preload="none"></video></dialog>
<script>
const cases=[{"title": "AI把监控拆了还撒谎", "note": "自己找热点生成视频，效果不好", "path": "01_视频案例/AI把监控拆了还撒谎.mp4", "category": "video", "rating": "差", "video": true, "poster": "assets/01.jpg"}, {"title": "3D建模 · 5秒无声样片", "note": "", "path": "03_试片与旧版本/3D建模_5秒无声样片.mp4", "category": "3d", "rating": "一般", "video": true, "poster": "assets/02.jpg"}, {"title": "关于爱情 · vibe大赏 · 原版无声", "note": "不给提示词的情况下，生成的视频", "path": "01_视频案例/关于爱情_vibe大赏_原版无声.mp4", "category": "video", "rating": "一般", "video": true, "poster": "assets/03.jpg"}, {"title": "关于爱的六件事 · 冷蓝版", "note": "多轮提示词规范后的效果", "path": "01_视频案例/关于爱的六件事_冷蓝版.mp4", "category": "video", "rating": "一般", "video": true, "poster": "assets/04.jpg"}, {"title": "瀑布钢琴 · 土耳其进行曲", "note": "", "path": "01_视频案例/瀑布钢琴_土耳其进行曲.mp4", "category": "video", "rating": "好", "video": true, "poster": "assets/05.jpg"}, {"title": "3D乐谱 · 土耳其进行曲", "note": "", "path": "01_视频案例/3D乐谱_土耳其进行曲.mp4", "category": "video", "rating": "一般", "video": true, "poster": "assets/06.jpg"}, {"title": "音乐会", "note": "3D音乐会，消耗了几亿token", "path": "01_视频案例/万籁_QW目录版.mp4", "category": "video", "rating": "好", "video": true, "poster": "assets/22.jpg"}, {"title": "偏偏是你 · 网页动画导出", "note": "AI生成视频", "path": "01_视频案例/偏偏是你_网页动画导出.mp4", "category": "video", "rating": "差", "video": true, "poster": "assets/23.jpg"}, {"title": "VirtualFit · 虚拟试衣", "note": "用开源的提示词生成网站，效果很棒", "path": "02_网页案例/VirtualFit_虚拟试衣/index.html", "category": "web", "rating": "好", "video": false, "poster": "assets/44.jpg"}, {"title": "试卷还原 · 全流程交互原型", "note": "APP UI设计", "path": "02_网页案例/试卷还原_全流程交互原型.html", "category": "web", "rating": "好", "video": false, "poster": "assets/49.jpg"}, {"title": "试卷还原 · 57页定稿画布预览", "note": "1. 消耗token最多\n2. iOS APP开发在人不参与的情况下，可以完成60%的工作。\n\n流程：自主分析竞品的界面 -> 设计UI -> 自主写开发开发 ->人工测试反馈 ->自主修复bug", "path": "02_网页案例/试卷还原_定稿画布预览/index.html", "category": "web", "rating": "好", "video": false, "poster": "assets/50.jpg", "demos": [{"label": "APP 录屏", "path": "demos/paper-app.mp4"}]}, {"title": "手机、电视防沉迷 APP", "note": "APP UI设计+后端、iOS端、Android端开发。自主完成90%的工作", "path": "02_网页案例/学霸关卡_v2_完整交互画布/index.html", "category": "web", "rating": "好", "video": false, "poster": "assets/51.jpg", "demos": [{"label": "手机演示", "path": "demos/family-phone.mp4"}, {"label": "电视演示", "path": "demos/family-tv.mp4"}]}, {"title": "雨夜便利店街角", "note": "一个长提示词生成", "path": "01_视频案例/雨夜便利店街角.mp4", "category": "video", "rating": "好", "video": true, "poster": "assets/52.jpg"}];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=path=>path.split('/').map(encodeURIComponent).join('/');
function draw(category){
 document.querySelectorAll('video').forEach(video=>video.pause());
 document.querySelector('#cases').innerHTML=['好','一般','差'].map(rating=>{
  const items=cases.filter(item=>item.category===category&&item.rating===rating);
  if(!items.length)return '';
  return `<section class="group" data-rating="${rating}"><h2>${rating}</h2><div class="grid">${items.map(item=>`<article class="card">${item.video?`<video class="preview" controls playsinline preload="none" poster="${url(item.poster)}" src="${url(item.path)}" aria-label="${esc(item.title)}"></video>`:`<a class="preview" href="${url(item.path)}" target="_blank" rel="noopener" aria-label="打开 ${esc(item.title)}"><img src="${url(item.poster)}" alt="${esc(item.title)}" loading="lazy"></a>`}<div class="body"><div class="card-heading"><h3>${esc(item.title)}</h3>${item.demos?`<button type="button" class="demo-button" data-demo="${cases.indexOf(item)}">查看 APP 演示视频</button>`:''}</div>${item.note?`<p>${esc(item.note)}</p>`:''}</div></article>`).join('')}</div></section>`;
 }).join('');
}
document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(other=>{other.classList.toggle('active',other===button);other.setAttribute('aria-pressed',String(other===button))});draw(button.dataset.category)}));
document.addEventListener('play',event=>{if(event.target.tagName==='VIDEO')document.querySelectorAll('video').forEach(video=>{if(video!==event.target)video.pause()})},true);
const demoDialog=document.querySelector('#demo-dialog'),demoVideo=document.querySelector('#demo-video'),demoTabs=document.querySelector('.demo-tabs');
let activeDemo=null,previousOverflow='';
function playDemo(index){
 const clip=activeDemo.demos[index];
 demoVideo.pause();demoVideo.src=url(clip.path);demoVideo.setAttribute('aria-label',activeDemo.title+' · '+clip.label);demoVideo.load();
 demoTabs.querySelectorAll('button').forEach((button,i)=>{button.classList.toggle('active',i===index);button.setAttribute('aria-pressed',String(i===index))});
 demoVideo.play().catch(()=>{});
}
document.querySelector('#cases').addEventListener('click',event=>{
 const button=event.target.closest('[data-demo]');if(!button)return;
 activeDemo=cases[Number(button.dataset.demo)];if(!activeDemo?.demos)return;
 document.querySelectorAll('video').forEach(video=>video.pause());
 document.querySelector('#demo-title').textContent=activeDemo.title;
 demoTabs.hidden=activeDemo.demos.length<2;
 demoTabs.innerHTML=activeDemo.demos.map((clip,i)=>`<button type="button" data-clip="${i}" aria-pressed="${i===0}">${esc(clip.label)}</button>`).join('');
 previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';demoDialog.showModal();playDemo(0);
});
demoTabs.addEventListener('click',event=>{const button=event.target.closest('[data-clip]');if(button)playDemo(Number(button.dataset.clip))});
document.querySelector('.demo-close').addEventListener('click',()=>demoDialog.close());
demoDialog.addEventListener('close',()=>{demoVideo.pause();demoVideo.removeAttribute('src');demoVideo.load();activeDemo=null;document.body.style.overflow=previousOverflow});
demoDialog.addEventListener('click',event=>{if(event.target===demoDialog){const r=demoDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)demoDialog.close()}});
draw('video');
</script></body></html>
