<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家长端 锁定确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F6F8;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;position:relative;overflow:hidden">
  <div aria-hidden="true" style="padding:36px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div style="height:40px;width:120px;border-radius:999px;background:#15192B"></div>
    <div style="height:250px;border-radius:24px;background:#FFFFFF"></div>
    <div style="height:84px;border-radius:18px;background:#FFFFFF"></div>
  </div>
  <a href="p05-today.dc.html" aria-label="关闭" style="position:absolute;inset:0;background:rgba(21,25,43,.5)"></a>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 34px">
    <div style="width:40px;height:5px;border-radius:3px;background:#D5D9E2;margin:0 auto"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:18px">
      <span style="width:48px;height:48px;border-radius:14px;background:#15192B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <div>
        <div style="font-size:21px;font-weight:900">现在锁定小宇的手机？</div>
        <div style="font-size:13px;color:#5B6275;margin-top:2px">锁定后会立刻全屏显示，孩子无法退出</div>
      </div>
    </div>

    <div style="font-size:15px;font-weight:700;margin-top:22px">锁多久</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px">
      <sc-for list="{{dur}}" as="d" hint-placeholder-count="4">
        <button style="height:48px;border-radius:12px;border:0;background:{{d.bg}};color:{{d.fg}};font:700 15px 'Noto Sans SC',sans-serif">{{d.t}}</button>
      </sc-for>
    </div>

    <div style="font-size:15px;font-weight:700;margin-top:20px">在锁屏上告诉他原因</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="4">
        <button style="height:36px;padding:0 14px;border-radius:999px;border:{{w.border}};background:{{w.bg}};font:500 14px 'Noto Sans SC',sans-serif;color:#15192B">{{w.t}}</button>
      </sc-for>
    </div>

    <div style="margin-top:18px;background:#F5F6F8;border-radius:12px;padding:12px;font-size:13px;color:#5B6275;line-height:1.6">锁定期间仍可：打电话 · 微信电话 · 作业帮（你设的不限时应用）</div>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px">
      <a href="p05-today.dc.html" style="height:56px;border-radius:14px;border:1.5px solid #D5D9E2;box-sizing:border-box;color:#15192B;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">取消</a>
      <a href="p06-today-alert.dc.html" style="height:56px;border-radius:14px;background:#15192B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700">确认锁定</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (on) => on ? { bg: '#15192B', fg: '#FFFFFF' } : { bg: '#F5F6F8', fg: '#15192B' };
    return {
      dur: ['直到我解锁', '30 分钟', '1 小时', '到明早 7:00'].map((t, i) => ({ t, ...sel(i === 1) })),
      words: ['该吃饭啦', '先写作业', '休息一下眼睛', '出门啦'].map((t, i) => ({ t, bg: i === 0 ? '#FFF1E6' : '#FFFFFF', border: i === 0 ? '1.5px solid #FF6A1F' : '1.5px solid #D5D9E2' }))
    };
  }
}
</script>
</body>
</html>
