<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>孩子端 我的</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#EAF0FF;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;padding:24px 18px 30px">
  <div style="height:56px;display:flex;align-items:center;margin-left:-10px">
    <a href="k04-home.dc.html" aria-label="返回" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:0 4px">
    <span style="width:64px;height:64px;border-radius:50%;background:#CFE3FF;border:4px solid #FFFFFF;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="38" height="38" viewBox="0 0 30 30" aria-hidden="true"><circle cx="10.5" cy="13" r="2" fill="#15192B"/><circle cx="19.5" cy="13" r="2" fill="#15192B"/><path d="M10 19c1.5 2 3 2.8 5 2.8s3.5-.8 5-2.8" stroke="#15192B" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
    <div><div style="font-size:24px;font-weight:900">小宇</div><div style="font-size:14px;color:#3D4560">三年级 · 已闯关 128 关</div></div>
  </div>

  <div style="margin-top:18px;background:#FFFFFF;border-radius:24px;padding:16px">
    <div style="font-size:16px;font-weight:900">我的徽章</div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px">
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;opacity:{{b.op}}">
          <span style="width:56px;height:56px;border-radius:50%;background:{{b.bg}};display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>
          <span style="font-size:12px;font-weight:700;text-align:center">{{b.t}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top:12px;background:#FFFFFF;border-radius:24px;padding:16px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15192B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span style="flex:1;font-size:16px;font-weight:900">位置守护</span>
      <span style="height:26px;padding:0 10px;border-radius:999px;background:#E7F6EE;color:#0B7A43;font-size:13px;font-weight:700;display:flex;align-items:center">妈妈打开了</span>
    </div>
    <div style="font-size:14px;color:#5B6275;margin-top:6px;line-height:1.5">每 5 分钟告诉妈妈一次你在哪。需要的话可以暂停，妈妈会知道你暂停了。</div>
    <button style="margin-top:12px;width:100%;height:48px;border-radius:14px;border:1.5px solid #D5D9E2;background:#FFFFFF;font:700 15px 'Noto Sans SC',sans-serif;color:#15192B">暂停 20 分钟</button>
  </div>

  <div style="margin-top:12px;background:#FFFFFF;border-radius:24px;padding:0 16px">
    <a href="k07-mistakes.dc.html" style="display:flex;align-items:center;height:58px;border-bottom:1px solid #EEF0F4;color:#15192B"><span style="flex:1;font-size:16px">错题本</span><span class="n" style="font-size:14px;color:#5B6275;margin-right:4px">4 道待复习</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <a href="#" style="display:flex;align-items:center;height:58px;border-bottom:1px solid #EEF0F4;color:#15192B"><span style="flex:1;font-size:16px">我的数据</span><span style="font-size:14px;color:#5B6275;margin-right:4px">看看上报了什么</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <a href="#" style="display:flex;align-items:center;height:58px;color:#15192B"><span style="flex:1;font-size:16px">申请记录</span><span style="font-size:14px;color:#5B6275;margin-right:4px">本周 2 次 · 同意 1 次</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      badges: [
        { t: '连闯 5 天', bg: '#FF6A1F', op: 1 },
        { t: '百题达人', bg: '#2556D9', op: 1 },
        { t: '一关全对', bg: '#12A150', op: 1 },
        { t: '连闯 30 天', bg: '#9AA1B2', op: 0.55 }
      ]
    };
  }
}
</script>
</body>
</html>
