<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家长端 我的</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:980px;box-sizing:border-box;background:#F5F6F8;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;position:relative">
  <div style="padding:44px 20px 0;display:flex;align-items:center;gap:14px">
    <span style="width:56px;height:56px;border-radius:50%;background:#FFE9A8;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 30 30" aria-hidden="true"><circle cx="10.5" cy="13" r="2" fill="#15192B"/><circle cx="19.5" cy="13" r="2" fill="#15192B"/><path d="M10 19c1.5 2 3 2.8 5 2.8s3.5-.8 5-2.8" stroke="#15192B" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
    <div><div style="font-size:22px;font-weight:900">小宇妈妈</div><div class="n" style="font-size:14px;color:#5B6275">138 **** 0000</div></div>
  </div>

  <a href="p16-membership.dc.html" style="margin:18px 16px 0;background:#15192B;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;color:#FFFFFF">
    <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25V15a7 7 0 0 1 14 0v10" stroke="#FF6A1F" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M12.6 18.6l2.4 2.4 4.4-4.8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="flex:1"><span style="display:block;font-size:17px;font-weight:700">会员试用中</span><span style="display:block;font-size:13px;color:#C9CDD8;margin-top:2px">还剩 5 天 · 所有功能都能用</span></span>
    <span style="height:36px;padding:0 14px;border-radius:10px;background:#FF6A1F;color:#15192B;font-size:14px;font-weight:700;display:flex;align-items:center">看看会员</span>
  </a>

  <div style="padding:20px 20px 8px;font-size:13px;font-weight:700;color:#5B6275">孩子和设备</div>
  <div style="margin:0 16px;background:#FFFFFF;border-radius:20px;padding:0 16px">
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
      <a href="#" style="display:flex;align-items:center;gap:12px;height:68px;border-bottom:1px solid #EEF0F4;color:#15192B">
        <span style="width:40px;height:40px;border-radius:50%;background:{{k.bg}};flex:none"></span>
        <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">{{k.n}}</span><span style="display:block;font-size:12px;color:#5B6275">{{k.d}}</span></span>
        <span style="font-size:12px;font-weight:700;color:#0B7A43;background:#E7F6EE;height:24px;padding:0 8px;border-radius:999px;display:flex;align-items:center">守护完整</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </sc-for>
    <a href="p02-add-child.dc.html" style="display:flex;align-items:center;gap:12px;height:56px;color:#15192B;font-size:15px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加孩子或设备</a>
  </div>

  <div style="padding:20px 20px 8px;font-size:13px;font-weight:700;color:#5B6275">一起管的家人</div>
  <div style="margin:0 16px;background:#FFFFFF;border-radius:20px;padding:0 16px">
    <div style="display:flex;align-items:center;gap:12px;height:64px;border-bottom:1px solid #EEF0F4">
      <span style="width:40px;height:40px;border-radius:50%;background:#D4F2E1;flex:none"></span>
      <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">小宇爸爸</span><span style="display:block;font-size:12px;color:#5B6275">可以看、可以管 · 操作会留记录</span></span>
    </div>
    <a href="#" style="display:flex;align-items:center;gap:12px;height:56px;color:#15192B;font-size:15px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>邀请家人（微信发送邀请）</a>
  </div>

  <div style="margin:20px 16px 0;background:#FFFFFF;border-radius:20px;padding:0 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <a href="#" style="display:flex;align-items:center;height:56px;border-bottom:1px solid #EEF0F4;color:#15192B">
        <span style="flex:1;font-size:15px">{{r}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </sc-for>
  </div>

  <nav style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #E4E7EE;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:18px;box-sizing:border-box">
    <a href="p05-today.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今天</a>
    <a href="p09-rules.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>规则</a>
    <a href="p12-report.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8"/></svg>报告</a>
    <a href="p15-me.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#15192B;font-size:12px;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6z"/></svg>我的</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      kids: [
        { n: '小宇', d: '三年级 · Redmi Pad SE · 小米电视', bg: '#CFE3FF' },
        { n: '朵朵', d: '一年级 · vivo Y78', bg: '#FFD6E0' }
      ],
      rows: ['通知设置', '设置图解与常见问题', '隐私与数据（导出 / 删除）', '关于学霸关卡']
    };
  }
}
</script>
</body>
</html>
