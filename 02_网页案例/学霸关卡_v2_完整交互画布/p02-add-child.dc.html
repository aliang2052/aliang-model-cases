<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家长端 添加孩子</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;display:flex;flex-direction:column">
  <div style="height:56px;display:flex;align-items:center;padding:0 8px;margin-top:24px">
    <a href="p01-login.dc.html" aria-label="返回" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="flex:1"></div>
    <span class="n" style="font-size:14px;color:#5B6275;padding-right:16px">1 / 3</span>
  </div>
  <div style="padding:8px 24px 0">
    <div style="display:flex;gap:6px"><span style="flex:1;height:4px;border-radius:2px;background:#15192B"></span><span style="flex:1;height:4px;border-radius:2px;background:#E4E7EE"></span><span style="flex:1;height:4px;border-radius:2px;background:#E4E7EE"></span></div>
    <div style="font-size:28px;font-weight:900;margin-top:24px">添加孩子</div>
    <div style="font-size:15px;color:#5B6275;margin-top:6px">题目会按年级和教材版本出，和学校进度对得上。</div>
  </div>

  <div style="padding:28px 24px 0;display:flex;flex-direction:column;gap:26px">
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:12px">选个头像</div>
      <div style="display:flex;justify-content:space-between">
        <sc-for list="{{avatars}}" as="a" hint-placeholder-count="6">
          <button aria-label="{{a.label}}" style="width:50px;height:50px;border-radius:50%;padding:0;background:{{a.bg}};border:{{a.ring}};display:flex;align-items:center;justify-content:center">
            <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="10.5" cy="13" r="2" fill="#15192B"/><circle cx="19.5" cy="13" r="2" fill="#15192B"/><path d="M10 19c1.5 2 3 2.8 5 2.8s3.5-.8 5-2.8" stroke="#15192B" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <label style="display:block">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">怎么称呼</div>
      <input type="text" value="小宇" aria-label="孩子昵称" style="width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:0;background:#F5F6F8;padding:0 16px;font:700 17px 'Noto Sans SC',sans-serif;color:#15192B;outline:none">
    </label>

    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">年级</div>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">
        <sc-for list="{{grades}}" as="g" hint-placeholder-count="9">
          <button style="height:42px;border-radius:12px;border:0;background:{{g.bg}};color:{{g.fg}};font:700 14px 'Noto Sans SC',sans-serif">{{g.t}}</button>
        </sc-for>
      </div>
    </div>

    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">教材版本 <span style="font-weight:400;color:#5B6275;font-size:13px">（不确定可以先跳过）</span></div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="4">
          <button style="height:42px;border-radius:12px;border:0;background:{{b.bg}};color:{{b.fg}};font:700 14px 'Noto Sans SC',sans-serif">{{b.t}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex:1"></div>
  <div style="padding:16px 24px 34px">
    <a href="p03-pair.dc.html" style="height:56px;border-radius:14px;background:#15192B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700">下一步：连接孩子的设备</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (on) => on ? { bg: '#15192B', fg: '#FFFFFF' } : { bg: '#F5F6F8', fg: '#15192B' };
    const gs = ['一年级','二年级','三年级','四年级','五年级','六年级','初一','初二','初三'];
    const bs = ['人教版','北师大版','苏教版','其他'];
    const av = [['#FFD8C2','橙色头像'],['#CFE3FF','蓝色头像'],['#D4F2E1','绿色头像'],['#FFE9A8','黄色头像'],['#E8DBFF','紫色头像'],['#FFD6E0','粉色头像']];
    return {
      avatars: av.map((a, i) => ({ bg: a[0], label: a[1], ring: i === 1 ? '3px solid #15192B' : '3px solid transparent' })),
      grades: gs.map((t, i) => ({ t, ...sel(i === 2) })),
      books: bs.map((t, i) => ({ t, ...sel(i === 0) }))
    };
  }
}
</script>
</body>
</html>
