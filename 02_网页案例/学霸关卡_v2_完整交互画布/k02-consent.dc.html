<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>孩子端 知情同意</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:960px;box-sizing:border-box;background:#EAF0FF;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;display:flex;flex-direction:column;padding:72px 20px 34px">
  <div style="font-size:30px;font-weight:900;padding:0 4px">小宇，先说清楚</div>
  <div style="font-size:16px;color:#3D4560;margin-top:8px;padding:0 4px;line-height:1.6">你已经和「小宇妈妈」连上了。下面是会发生的事，看完再决定。</div>

  <div style="margin-top:22px;background:#FFFFFF;border-radius:24px;padding:20px">
    <div style="font-size:17px;font-weight:900">爸爸妈妈能看到</div>
    <sc-for list="{{see}}" as="s" hint-placeholder-count="3">
      <div style="display:flex;gap:12px;margin-top:14px;align-items:flex-start">
        <span style="width:32px;height:32px;border-radius:10px;background:#EAF0FF;display:flex;align-items:center;justify-content:center;flex:none;color:#2556D9"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <div><div style="font-size:16px;font-weight:700">{{s.t}}</div><div style="font-size:14px;color:#5B6275;margin-top:2px;line-height:1.5">{{s.d}}</div></div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:12px;background:#FFFFFF;border-radius:24px;padding:20px">
    <div style="font-size:17px;font-weight:900">爸爸妈妈看不到</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
      <sc-for list="{{nosee}}" as="n" hint-placeholder-count="4">
        <span style="height:34px;padding:0 12px;border-radius:999px;background:#E7F6EE;color:#0B7A43;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>{{n}}</span>
      </sc-for>
    </div>
  </div>

  <div style="margin-top:12px;padding:0 4px;font-size:14px;color:#3D4560;line-height:1.6">随时可以在「我的 → 我的数据」里看到上报了什么。</div>

  <div style="flex:1"></div>
  <a href="k03-guard.dc.html" style="height:60px;border-radius:18px;background:#FF6A1F;box-shadow:0 4px 0 #C2410C;color:#15192B;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900">我知道了，同意</a>
  <a href="#" style="margin-top:14px;text-align:center;font-size:15px;color:#3D4560">我有疑问，先去问爸爸妈妈</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      see: [
        { t: '每天用了多久、用了哪些应用', d: '比如“哔哩哔哩 38 分钟”，看不到你在里面看了什么' },
        { t: '闯关答题对了几道、错了哪些', d: '用来帮你找到没学会的地方' },
        { t: '位置（只有打开位置守护时）', d: '打开后你的屏幕上会一直有提示，你也可以暂停' }
      ],
      nosee: ['聊天内容', '照片和视频', '你打的字', '浏览记录']
    };
  }
}
</script>
</body>
</html>
