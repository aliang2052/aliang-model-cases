<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>孩子端 错题本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#EAF0FF;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;padding:24px 18px 30px;display:flex;flex-direction:column">
  <div style="height:56px;display:flex;align-items:center;margin-left:-10px">
    <a href="k06-me.dc.html" aria-label="返回" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="font-size:22px;font-weight:900;margin-left:4px">错题本</span>
  </div>
  <div style="display:flex;background:#D7E3FF;border-radius:14px;padding:4px;margin-top:6px">
    <button style="flex:1;height:40px;border:0;border-radius:11px;background:#FFFFFF;font:700 15px 'Noto Sans SC',sans-serif;color:#15192B">待复习 4</button>
    <button style="flex:1;height:40px;border:0;border-radius:11px;background:transparent;font:500 15px 'Noto Sans SC',sans-serif;color:#3D4560">已经会了 12</button>
  </div>
  <div style="font-size:14px;color:#3D4560;margin-top:12px;padding:0 4px">每道题连续答对 2 次，就会搬到「已经会了」。</div>

  <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{items}}" as="q" hint-placeholder-count="4">
      <div style="background:#FFFFFF;border-radius:22px;padding:16px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="height:24px;padding:0 9px;border-radius:999px;background:#EAF0FF;color:#2556D9;font-size:12px;font-weight:700;display:flex;align-items:center">{{q.tag}}</span>
          <span style="flex:1"></span>
          <span style="display:flex;gap:4px" aria-label="{{q.progLabel}}"><span style="width:18px;height:6px;border-radius:3px;background:{{q.d1}}"></span><span style="width:18px;height:6px;border-radius:3px;background:#E4E7EE"></span></span>
        </div>
        <div style="font-size:18px;font-weight:700;margin-top:10px;line-height:1.5">{{q.q}}</div>
        <div style="display:flex;gap:16px;margin-top:8px;font-size:14px">
          <span style="color:#B42318">我选了 <b>{{q.mine}}</b></span>
          <span style="color:#0B7A43">正确 <b>{{q.right}}</b></span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex:1"></div>
  <a href="k08-quiz.dc.html" style="height:64px;border-radius:20px;background:#FF6A1F;box-shadow:0 4px 0 #C2410C;color:#15192B;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:900">复习这 4 道<span class="n" style="height:30px;padding:0 10px;border-radius:999px;background:#15192B;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center">+10 分钟</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const I = [
      ['数学 · 退位减法', '63 − 28 = ?', '45', '35', true],
      ['数学 · 退位减法', '小明有 52 张卡片，送出 17 张，还剩几张？', '45 张', '35 张', false],
      ['语文 · 古诗', '“春眠不觉晓”的下一句是？', '花落知多少', '处处闻啼鸟', true],
      ['英语 · 单词', '“紫色”用英语怎么说？', 'pink', 'purple', false]
    ];
    return { items: I.map(([tag, q, mine, right, half]) => ({ tag, q, mine, right, d1: half ? '#12A150' : '#E4E7EE', progLabel: half ? '已答对 1 次，还差 1 次' : '还没答对过' })) };
  }
}
</script>
</body>
</html>
