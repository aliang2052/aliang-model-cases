<script>(function canvasApp(layout) {

    np2: '首页 3 秒看懂孩子状态；奖励、锁定一步完成',
    np3: '时段、应用、学习内容；修改即生效',
    np4: '每周报告、实时位置、所有通知', np5: '账号、家庭成员、会员与价格',
    nk1: '扫码配对、知情同意、守护权限逐项开启', nk2: '剩余时间一眼可见，申请加时发给家长',

    const value = JSON.parse(localStorage.getItem(key) || '{}');

    const slot = create('section', 'board'); slot.dataset.file = file; slot.dataset.group = group.id; slot.dataset.area = areaOf(group.id);
    const position = saved[file];
    const valid = Number.isFinite(position?.x) && Number.isFinite(position?.y);
    Object.assign(slot.style, { left: `${valid ? position.x : b.x}px`, top: `${valid ? position.y : b.y}px`, width: `${b.w}px`, height: `${b.h}px` });

    title.addEventListener('click', e => { if (e.detail === 0) openFocus(file); });
  }

    const el = create('section', 'group-title'); el.dataset.note = g.id; el.dataset.area = areaOf(g.id);
    Object.assign(el.style, { left: `${g.x}px`, top: `${g.y}px` });
    el.append(create('h2', '', g.text), create('p', '', subtitles[g.id])); world.append(el);
  }
  let noteIndex = 0;
  for (const [id, n] of Object.entries(layout.notes).filter(([, n]) => n.kind !== 'title1')) {
    const el = create('aside', 'note'); el.dataset.note = id; el.dataset.area = id.startsWith('sp') ? 'parent' : 'child';
    Object.assign(el.style, { left: `${n.x}px`, top: `${n.y}px`, width: `${n.w}px`, transform: `rotate(${noteIndex++ % 2 ? -1.5 : 1.5}deg)` });

  }
  function bounds(area) {
    const elements = [...world.querySelectorAll(':scope > [data-area]')].filter(el => !area || el.dataset.area === area);
    const inv = Math.min(1 / scale, 3);

    $('#percentage').textContent = `${Math.round(scale * 100)}%`;
