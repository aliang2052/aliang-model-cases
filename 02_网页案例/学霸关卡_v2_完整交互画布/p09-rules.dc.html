<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家长端 规则</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:1300px;box-sizing:border-box;background:#F5F6F8;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;position:relative">
  <div style="padding:40px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:28px;font-weight:900">规则</span>
    <span style="height:36px;padding:0 12px 0 4px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700"><span style="width:28px;height:28px;border-radius:50%;background:#CFE3FF"></span>小宇<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
  </div>

  <div style="margin:16px 16px 0;display:flex;background:#E9ECF1;border-radius:12px;padding:4px">
    <button style="flex:1;height:40px;border:0;border-radius:9px;background:#FFFFFF;font:700 15px 'Noto Sans SC',sans-serif;color:#15192B;box-shadow:0 1px 3px rgba(21,25,43,.12)">上学日</button>
    <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;font:500 15px 'Noto Sans SC',sans-serif;color:#5B6275">周末与节假日</button>
  </div>

  <div style="margin:12px 16px 0;background:#FFFFFF;border-radius:20px;padding:18px">
    <div style="font-size:14px;color:#5B6275">每天可用</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
      <button aria-label="减少 15 分钟" style="width:44px;height:44px;border-radius:50%;border:1.5px solid #D5D9E2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <span class="n" style="font-size:40px;font-weight:800">1<span style="font-size:18px;font-weight:600;margin:0 6px 0 2px">小时</span>30<span style="font-size:18px;font-weight:600;margin-left:2px">分</span></span>
      <button aria-label="增加 15 分钟" style="width:44px;height:44px;border-radius:50%;border:1.5px solid #D5D9E2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div style="font-size:13px;color:#5B6275;text-align:center;margin-top:6px">周一到周五 · 不含闯关赚的时间和不限时应用</div>
  </div>

  <div style="margin:12px 16px 0;background:#FFFFFF;border-radius:20px;padding:18px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg><span style="font-size:17px;font-weight:700">睡觉时间</span></div>
      <span style="width:52px;height:32px;border-radius:999px;background:#15192B;position:relative;display:inline-block"><span style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF"></span></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
      <button style="flex:1;height:64px;border-radius:14px;border:0;background:#F5F6F8;font-family:Outfit,sans-serif;color:#15192B;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font:400 12px 'Noto Sans SC',sans-serif;color:#5B6275">开始</span><span style="font-size:24px;font-weight:700">21:30</span></button>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <button style="flex:1;height:64px;border-radius:14px;border:0;background:#F5F6F8;font-family:Outfit,sans-serif;color:#15192B;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font:400 12px 'Noto Sans SC',sans-serif;color:#5B6275">次日结束</span><span style="font-size:24px;font-weight:700">07:00</span></button>
    </div>
    <div style="font-size:13px;color:#5B6275;margin-top:10px">睡前 10 分钟会提醒孩子</div>
  </div>

  <div style="margin:12px 16px 0;background:#FFFFFF;border-radius:20px;padding:6px 18px">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 0 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span style="font-size:17px;font-weight:700">闯关</span></div>
    <sc-for list="{{quiz}}" as="r" hint-placeholder-count="4">
      <button style="width:100%;display:flex;align-items:center;height:54px;border:0;border-top:1px solid #EEF0F4;background:transparent;padding:0;font-family:'Noto Sans SC',sans-serif;color:#15192B">
        <span style="flex:1;text-align:left;font-size:15px">{{r.k}}</span>
        <span class="n" style="font-size:15px;font-weight:700">{{r.v}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </sc-for>
    <div style="border-top:1px solid #EEF0F4;padding:14px 0">
      <div style="font-size:15px">时间用完以后</div>
      <div style="display:flex;background:#F5F6F8;border-radius:12px;padding:4px;margin-top:10px">
        <button style="flex:1;height:40px;border:0;border-radius:9px;background:#15192B;color:#FFFFFF;font:700 14px 'Noto Sans SC',sans-serif">可以闯关继续</button>
        <button style="flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#5B6275;font:500 14px 'Noto Sans SC',sans-serif">直接锁定</button>
      </div>
    </div>
  </div>

  <div style="margin:12px 16px 0;background:#FFFFFF;border-radius:20px;padding:0 18px">
    <a href="p10-apps.dc.html" style="display:flex;align-items:center;gap:12px;height:68px;color:#15192B">
      <span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">应用管理</span><span style="display:block;font-size:13px;color:#5B6275">禁止 3 个 · 不限时 5 个 · 单独限额 1 个</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a href="p11-learning.dc.html" style="display:flex;align-items:center;gap:12px;height:68px;color:#15192B;border-top:1px solid #EEF0F4">
      <span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">学习内容</span><span style="display:block;font-size:13px;color:#5B6275">三年级上 · 人教版 · 数学 语文 英语</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <div style="display:flex;align-items:center;gap:12px;height:68px;border-top:1px solid #EEF0F4">
      <span style="flex:1"><span style="display:block;font-size:16px;font-weight:700">位置守护</span><span style="display:block;font-size:13px;color:#5B6275">开启后孩子手机上会一直有提示</span></span>
      <span style="width:52px;height:32px;border-radius:999px;background:#D5D9E2;position:relative;display:inline-block"><span style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF"></span></span>
    </div>
  </div>

  <div style="position:absolute;left:50%;top:96px;transform:translateX(-50%);height:40px;padding:0 16px;border-radius:999px;background:#15192B;color:#FFFFFF;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(21,25,43,.25);white-space:nowrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12A150" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已同步到小宇的手机
  </div>

  <nav style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#FFFFFF;border-top:1px solid #E4E7EE;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:18px;box-sizing:border-box">
    <a href="p05-today.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今天</a>
    <a href="p09-rules.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#15192B;font-size:12px;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2" fill="currentColor"/><circle cx="9" cy="12" r="2" fill="currentColor"/><circle cx="17" cy="18" r="2" fill="currentColor"/></svg>规则</a>
    <a href="p12-report.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8"/></svg>报告</a>
    <a href="p15-me.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5B6275;font-size:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>我的</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      quiz: [
        { k: '连续用多久要闯一关', v: '30 分钟' },
        { k: '每关几道题', v: '3 题' },
        { k: '通关奖励', v: '10 分钟' },
        { k: '每天最多能赚', v: '40 分钟' }
      ]
    };
  }
}
</script>
</body>
</html>
