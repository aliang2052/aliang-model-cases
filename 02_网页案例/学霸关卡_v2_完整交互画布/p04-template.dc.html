<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家长端 选择规则模板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Outfit:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.n{font-family:Outfit,'Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums}
a{color:#2556D9;text-decoration:none}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#F5F6F8;font-family:'Noto Sans SC',system-ui,sans-serif;color:#15192B;display:flex;flex-direction:column">
  <div style="height:56px;display:flex;align-items:center;padding:0 8px;margin-top:24px">
    <a href="p03-pair.dc.html" aria-label="返回" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#15192B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="flex:1"></div>
    <span class="n" style="font-size:14px;color:#5B6275;padding-right:16px">3 / 3</span>
  </div>
  <div style="padding:8px 20px 0">
    <div style="display:flex;gap:6px"><span style="flex:1;height:4px;border-radius:2px;background:#15192B"></span><span style="flex:1;height:4px;border-radius:2px;background:#15192B"></span><span style="flex:1;height:4px;border-radius:2px;background:#15192B"></span></div>
    <div style="font-size:26px;font-weight:900;margin-top:20px">先选一套规则</div>
    <div style="font-size:14px;color:#5B6275;margin-top:6px">之后随时能在「规则」里细调，改完立刻生效。</div>
  </div>

  <div style="padding:18px 20px 0;display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
      <button style="text-align:left;background:#FFFFFF;border-radius:20px;padding:18px;border:{{p.border}};font-family:'Noto Sans SC',sans-serif;color:#15192B;display:block;width:100%">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:19px;font-weight:900">{{p.name}}</span>
          <sc-if value="{{p.rec}}" hint-placeholder-val="{{false}}"><span style="height:24px;padding:0 9px;border-radius:999px;background:#FF6A1F;color:#15192B;font-size:12px;font-weight:700;display:inline-flex;align-items:center">多数家庭选这个</span></sc-if>
          <span style="flex:1"></span>
          <span style="width:22px;height:22px;border-radius:50%;border:{{p.radio}};box-sizing:border-box"></span>
        </div>
        <div style="font-size:13px;color:#5B6275;margin-top:4px">{{p.desc}}</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px">
          <div style="background:#F5F6F8;border-radius:12px;padding:10px"><div style="font-size:12px;color:#5B6275">上学日</div><div class="n" style="font-size:18px;font-weight:700;margin-top:2px">{{p.school}}</div></div>
          <div style="background:#F5F6F8;border-radius:12px;padding:10px"><div style="font-size:12px;color:#5B6275">周末</div><div class="n" style="font-size:18px;font-weight:700;margin-top:2px">{{p.weekend}}</div></div>
          <div style="background:#F5F6F8;border-radius:12px;padding:10px"><div style="font-size:12px;color:#5B6275">宵禁</div><div class="n" style="font-size:18px;font-weight:700;margin-top:2px">{{p.bed}}</div></div>
        </div>
        <div style="font-size:13px;color:#15192B;margin-top:12px;line-height:1.6">{{p.more}}</div>
      </button>
    </sc-for>
  </div>

  <div style="flex:1"></div>
  <div style="padding:14px 20px 34px">
    <a href="p05-today.dc.html" style="height:56px;border-radius:14px;background:#15192B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700">完成，开始守护</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      { name: '推荐', desc: '松紧适中，孩子能靠闯关多赚一点', school: '1.5 时', weekend: '3 时', bed: '21:30', more: '每用 30 分钟闯一关 · 每关 3 题 · 通关奖励 10 分钟，每天最多赚 40 分钟', rec: true },
      { name: '严格', desc: '适合考试前或已经沉迷的阶段', school: '1 时', weekend: '2 时', bed: '21:00', more: '每用 20 分钟闯一关 · 每关 5 题 · 时间用完直接锁定', rec: false },
      { name: '宽松', desc: '适合自律较好的孩子、寒暑假', school: '2 时', weekend: '4 时', bed: '22:00', more: '每用 45 分钟闯一关 · 每关 3 题 · 每天最多赚 60 分钟', rec: false }
    ];
    return { plans: P.map((p, i) => ({ ...p, border: i === 0 ? '2px solid #15192B' : '2px solid transparent', radio: i === 0 ? '7px solid #15192B' : '2px solid #C3C8D4' })) };
  }
}
</script>
</body>
</html>
